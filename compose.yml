services:
  redis-cluster:
    image: redis:7.4-alpine
    container_name: redis-cluster
    # 3 masters + 3 replicas, one process per port, all announcing 127.0.0.1 so
    # MOVED/ASK redirects stay reachable from the Docker host.
    entrypoint: [ "/bin/sh", "/docker/start-redis-cluster.sh" ]
    labels:
      # The app builds its own RedisClusterConfiguration from cache.redis.config.nodes,
      # so Boot must not derive single-node connection details from this service.
      org.springframework.boot.ignore: "true"
    volumes:
      - ./docker/start-redis-cluster.sh:/docker/start-redis-cluster.sh:ro
      - redis-cluster-data:/data
    ports:
      - "7100:7100"
      - "7101:7101"
      - "7102:7102"
      - "7103:7103"
      - "7104:7104"
      - "7105:7105"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -p 7100 cluster info | grep -q cluster_state:ok" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  redis-cluster-data:
